<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#141923">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Churrobots Dashboard</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link id="dashboard-style" rel="stylesheet" href="style.css">
  </head>
  <body>
    <section class="ds-zone" aria-label="Driver Station zone">
      <div id="driver-station-placeholder" class="driver-station-placeholder">Driver Station floats here</div>
      <header id="driver-station" hidden>
        <div class="ds-controls">
          <div class="ds-brand">SIM DRIVER STATION</div>
          <div class="modes" role="group" aria-label="Robot mode">
            <button data-mode="teleop">Teleop</button>
            <button data-mode="auto">Autonomous</button>
            <button data-mode="test">Test</button>
          </div>
          <div class="alliances" role="group" aria-label="Alliance">
            <button data-alliance="blue">Blue</button>
            <button data-alliance="red">Red</button>
          </div>
          <button id="enable-toggle" class="enable-toggle">Enable</button>
        </div>
        <div id="gamepads" class="gamepads" aria-label="Live gamepad inputs"></div>
      </header>
    </section>

    <section class="connectivity" aria-label="NetworkTables connectivity">
      <strong>NetworkTables</strong>
      <input id="team-number" class="team-number" inputmode="numeric" aria-label="FRC team number" placeholder="Team #">
      <div id="connection-points" class="connection-points"></div>
    </section>

    <nav>
      <div class="tabs" role="tablist">
        <button class="tab selected" data-tab="diagnostics">Main</button>
        <button class="tab" data-tab="cameras">Cameras</button>
        <button class="tab" data-tab="networktables">NetworkTables</button>
      </div>
    </nav>

    <main>
      <section id="diagnostics-panel" class="card tab-panel main-dashboard">
        <div class="dashboard-column field-section">
          <div class="auto-bar">
            <label for="auto-selector">Autonomous</label>
            <select id="auto-selector" disabled>
              <option>Waiting for chooser…</option>
            </select>
          </div>
          <div class="section-title">
            <h2>Field</h2>
            <span id="field-pose" class="field-pose">Waiting for pose…</span>
          </div>
          <div id="field-view" class="field-view"><canvas id="field-canvas"></canvas></div>
        </div>
        <div class="dashboard-column faults-column">
          <div class="section-title faults-title">
            <h2>Faults</h2>
            <span id="diagnostic-summary" class="diagnostic-summary">Waiting for devices…</span>
          </div>
          <div id="diagnostics" class="diagnostics"></div>
        </div>
      </section>

      <section id="networktables-panel" class="card tab-panel" hidden>
        <div class="section-title">
          <h2>NetworkTables</h2>
          <input id="topic-filter" type="search" placeholder="Filter topics" autocomplete="off">
        </div>
        <div id="topics" class="topics"></div>
      </section>

      <section id="cameras-panel" class="card tab-panel" hidden>
        <div class="section-title">
          <h2>Camera streams</h2>
          <label class="camera-host-label">PhotonVision host <input id="camera-host" value="photonvision.local" spellcheck="false"></label>
        </div>
        <div id="cameras" class="cameras"></div>
      </section>
    </main>

    <script type="module">
      const version = new URLSearchParams(location.search).get("v") ?? "initial";
      document.querySelector("#dashboard-style").href = `style.css?v=${version}`;
      import(`./app.js?v=${version}`);
    </script>
  </body>
</html>
